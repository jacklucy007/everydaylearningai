# 输出配置
output:
  # 归档输出目录（相对于项目根目录）
  archive_dir: "output"
  
  # 文件命名格式
  # 可用变量: {date}, {title}, {video_id}
  folder_format: "{date}_{video_id}"

# 处理配置
processing:
  # 批量模式下每次最多处理的数量
  max_batch_size: 10
  
  # 是否自动下载封面图片
  download_cover: true
  
  # AI 改写的目标字数（约）
  summary_target_words: 2000
